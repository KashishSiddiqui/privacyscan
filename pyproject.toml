[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "privacyscan"
version = "1.0.0"
description = "Static GDPR/privacy risk scanner for source code."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
privacyscan = "privacyscan.cli:main"

[tool.setuptools]
packages = ["privacyscan"]
